name: cache-harvest-control
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mr-benty'
      - name: Trusted private-package install
        if: github.event_name == 'push'
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - name: Repository-controlled test step
        run: bash ./ci-probe.sh
